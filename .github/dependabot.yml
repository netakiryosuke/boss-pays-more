version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    target-branch: "main"

    commit-message:
      prefix: "deps"

    labels:
      - "dependencies"

    ignore:
      # eslint-config-next が ESLint 10 未対応のため、ESLint v10 以上へのアップグレードを抑制する
      - dependency-name: "eslint"
        versions: [">=10"]

    groups:
      npm-dependencies:
        patterns:
          - "*"
